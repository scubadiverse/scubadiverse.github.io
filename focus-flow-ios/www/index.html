<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProjectSavvy</title>
<style>
  html,body{margin:0;height:100%;background:#0f1115;color:#e7e9ee;
    font-family:-apple-system,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center;padding:24px}
  .dot{width:36px;height:36px;border-radius:50%;margin:0 auto 14px;
    border:3px solid #2a2f3a;border-top-color:#39d98a;
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <div>Loading ProjectSavvy…</div>
  </div>
</body>
</html>
